[package]
name = "deeplab-workbench"
version = "1.0.2"
description = "Open Science Desktop"
authors = ["AI4S Workbench contributors"]
edition = "2021"

[lib]
name = "deeplab_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent webview background for the vibrancy sidebar
# (tauri.macos.conf.json); no-op on other platforms.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree via tauri — used directly for stall timeouts on uv setup
# and to bridge the callback-based native dialogs into awaitable commands.
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
getrandom = "0.4.3"
opener = { version = "0.8.5", features = ["reveal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# WebSocket upgrade proxy: the desktop SPA's DshRuntime opens the dsh event
# streams (`/api/events.mux`, `/api/events.host`) as WebSockets, and the
# tauri://localhost webview cannot reach the loopback sidecar cross-origin — so
# the gateway upgrades the client connection and relays frames to the sidecar.
tungstenite = { version = "0.24", features = ["handshake"] }
sha1 = "0.10"
base64 = "0.22"
# Watches the active workspace so file changes from outside the app (an external
# editor, a detached process) still enqueue a debounced git snapshot.
notify = "6"
# ssh reads authentication answers from a terminal, never from stdin, so an
# interactive sign-in to a 2FA cluster (#73) needs a real pty on every platform.
portable-pty = "0.9"

# Already in the tree via tao — used to re-pin the traffic lights (src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

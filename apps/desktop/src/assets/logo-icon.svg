<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#0c3475"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sheen)"/>

  <!-- Big Dipper (Ursa Major) constellation lines -->
  <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M297 338 L389 379 L491 430 L583 482"/>
    <path d="M583 482 L727 543 L645 686 L502 666 L583 482"/>
  </g>

  <!-- Star glows -->
  <g fill="url(#glow)">
    <circle cx="297" cy="338" r="88"/>
    <circle cx="389" cy="379" r="73"/>
    <circle cx="491" cy="430" r="81"/>
    <circle cx="583" cy="482" r="68"/>
    <circle cx="727" cy="543" r="78"/>
    <circle cx="645" cy="686" r="73"/>
    <circle cx="502" cy="666" r="86"/>
  </g>

  <!-- Star cores -->
  <g fill="#ffffff">
    <circle cx="297" cy="338" r="34"/>
    <circle cx="389" cy="379" r="28"/>
    <circle cx="491" cy="430" r="31"/>
    <circle cx="583" cy="482" r="26"/>
    <circle cx="727" cy="543" r="30"/>
    <circle cx="645" cy="686" r="28"/>
    <circle cx="502" cy="666" r="33"/>
  </g>

  <!-- Delicate cross-glints on the two brightest stars -->
  <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round">
    <path d="M297 300 L297 376"/>
    <path d="M259 338 L335 338"/>
    <path d="M502 628 L502 704"/>
    <path d="M464 666 L540 666"/>
  </g>
</svg>

# Bundled DeepSeek Harness ACP automation server composition. This runtime is
# fetched by scripts/dev/fetch-dsh-acp.sh (node_modules is git-ignored) and
# bundled into the app like opencode / skills / acp-server.
#
# The ACP demo boot expects DEEPSEEK_API_KEY in the environment; the app injects
# it from the user's own OpenCode credential store when it spawns the launcher.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-flash

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
    persistenceRoot: !!js process.env.DSH_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: 'none'
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Keep answers brief and factual.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'
